name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar Inicio TV y Teclado TV
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APKs
        run: |
          mkdir salida
          cp inicio/build/outputs/apk/debug/inicio-debug.apk salida/InicioTV.apk
          cp teclado/build/outputs/apk/debug/teclado-debug.apk salida/TecladoTV-CELULAR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: InicioTV-apks
          path: salida/*.apk
