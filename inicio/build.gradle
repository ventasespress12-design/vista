plugins {
    id 'com.android.application'
}

// INICIO TV: pantalla de inicio liviana para el stick (sin librerías extra, sin publicidad).
android {
    namespace 'com.edgar.inicio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.edgar.inicio'
        minSdk 24
        targetSdk 29
        versionCode 6
        versionName '1.5'
    }

    signingConfigs {
        fija {
            storeFile rootProject.file('firma/subtitulos.jks')
            storePassword 'subtitulos123'
            keyAlias 'subtitulos'
            keyPassword 'subtitulos123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fija
        }
        release {
            signingConfig signingConfigs.fija
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// Sin dependencias: así queda lo más liviana posible.
