plugins {
    id 'com.android.application'
}

// TECLADO TV: app del celular para escribir en el stick y manejarlo como control remoto.
android {
    namespace 'com.edgar.tecladotv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.edgar.tecladotv'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        fija {
            storeFile rootProject.file('firma/subtitulos.jks')
            storePassword 'subtitulos123'
            keyAlias 'subtitulos'
            keyPassword 'subtitulos123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fija
        }
        release {
            signingConfig signingConfigs.fija
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
